apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fareops-gitops
  namespace: flux-system
spec:
  interval: 30s
  url: https://github.com/nikunj169/fareops-gitops
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/local
  prune: true
  sourceRef:
    kind: GitRepository
    name: fareops-gitops
