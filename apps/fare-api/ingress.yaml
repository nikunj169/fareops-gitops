apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fare-api
  namespace: fareops
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fare-api
                port: {number: 80}
