apiVersion: v1
kind: PersistentVolume
metadata:
  name: fareops-data
spec:
  capacity: {storage: 5Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/fareops-data
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fareops-data
  namespace: fareops
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: fareops-data
  resources:
    requests: {storage: 5Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: fareops
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 2Gi}
