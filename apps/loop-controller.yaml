apiVersion: v1
kind: ServiceAccount
metadata:
  name: loop-controller
  namespace: fareops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loop-controller
  namespace: fareops
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [argoproj.io]
    resources: [rollouts]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loop-controller
  namespace: fareops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loop-controller
subjects:
  - kind: ServiceAccount
    name: loop-controller
    namespace: fareops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loop-controller
  namespace: fareops
spec:
  replicas: 1
  selector:
    matchLabels: {app: loop-controller}
  template:
    metadata:
      labels: {app: loop-controller}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: loop-controller
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: loop-controller
          image: ghcr.io/nikunj169/fareops-loop-controller:7f95ef3 # fareops:loop-controller-image
          ports:
            - containerPort: 8000
          env:
            - name: TRAINER_IMAGE
              value: ghcr.io/nikunj169/fareops-trainer:7f95ef3 # fareops:trainer-image
            - {name: NAMESPACE, value: fareops}
            - {name: MLFLOW_TRACKING_URI, value: "http://mlflow.fareops.svc.cluster.local:5000"}
            - {name: DATA_DIR, value: /mnt/fareops-data}
            - {name: GITOPS_REPO, value: nikunj169/fareops-gitops}
            - {name: GITOPS_BRANCH, value: main}
            - {name: RETRAIN_COOLDOWN_SECONDS, value: "900"}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef: {name: gitops-token, key: token}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: loop-controller
  namespace: fareops
spec:
  selector: {app: loop-controller}
  ports:
    - {port: 8000, targetPort: 8000}
