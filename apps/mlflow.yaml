apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: fareops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: mlflow
          image: ghcr.io/nikunj169/fareops-mlflow:2fff66a # fareops:mlflow-image
          args:
            - --host=0.0.0.0
            - --port=5000
            - --workers=1
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --artifacts-destination=/mlflow/artifacts
            - --serve-artifacts
            - --allowed-hosts=mlflow.fareops.svc.cluster.local:5000,mlflow.fareops.svc.cluster.local,mlflow:5000,localhost:5000,localhost,127.0.0.1:5000
          env:
            - {name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION, value: "false"}
            - {name: MLFLOW_SERVER_JOB_ENABLE_PERIODIC_TASKS, value: "false"}
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /mlflow}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mlflow-data}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: fareops
spec:
  selector: {app: mlflow}
  ports:
    - {port: 5000, targetPort: 5000}
