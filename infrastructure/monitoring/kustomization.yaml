apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - prometheus.yaml
  - alertmanager.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-config
    files: [prometheus.yml, alert-rules.yml]
  - name: alertmanager-config
    files: [alertmanager.yml]
  - name: grafana-datasources
    files: [datasources.yaml=grafana-datasources.yml]
  - name: grafana-dashboard-provider
    files: [dashboards.yaml=grafana-dashboard-provider.yml]
  - name: grafana-dashboards
    files: [fareops.json=fareops-dashboard.json]
